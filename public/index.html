<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дурка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,500&family=PT+Mono&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: a found film that plays full screen. Each scene is one frame the camera slowly crawls over, subtitles tell the story,
   and at a fork the film freezes and asks you what to do, with a timer like Bandersnatch */
:root{
  --night:#050505; --ash:#8f8a82; --bone:#ece6da; --stamp:#ff7a1a; --ember:#ff4d00;
  --serif:"Cormorant Garamond","Times New Roman",serif; --mono:"PT Mono","Courier New",monospace; --sans:"PT Sans",Arial,sans-serif;
  --bar:clamp(28px,9vh,90px);
  color-scheme:dark;
}
html,body{margin:0;height:100%}
html{background:var(--night)}
body{background:var(--night);color:var(--bone);font-family:var(--serif);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
.mono{font:12px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}

#screen{position:fixed;inset:0;overflow:hidden;background:#000;cursor:default}

/* the frame: camera crawls across the photo while the projector shakes it a little */
#shot{position:absolute;inset:0;animation:jitter .25s steps(2) infinite}
#shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease;
  filter:brightness(.82) contrast(1.12) saturate(.85) sepia(.12);animation:kb var(--dur,40s) cubic-bezier(.25,.1,.4,1) both,flick 5s steps(1) infinite}
#shot img.on{opacity:1}
/* wide screens: the whole portrait frame in the middle, its own blurred glow fills the sides */
#shot img.bg{animation:none;filter:blur(30px) brightness(.32) saturate(.7);transform:scale(1.2)}
#shot img.bg.on{opacity:1}
@media (min-aspect-ratio:1/1){
  #shot img.fg{object-fit:contain;transform-origin:50% var(--o,30%);animation-name:kbw,flick}
}
@keyframes kbw{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes kb{from{object-position:var(--x0,50%) var(--y0,20%);transform:scale(1.04)}to{object-position:var(--x1,50%) var(--y1,80%);transform:scale(1.2)}}
@keyframes jitter{0%{transform:translate(0,0)}50%{transform:translate(.6px,-.8px)}}
@keyframes flick{0%,100%{filter:brightness(.82) contrast(1.12) saturate(.85) sepia(.12)}43%{filter:brightness(.7) contrast(1.15) saturate(.85) sepia(.12)}44%{filter:brightness(1.05) contrast(1.1) saturate(.9) sepia(.1)}46%{filter:brightness(.8) contrast(1.12) saturate(.85) sepia(.12)}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.75) 100%)}
.scratch{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18);pointer-events:none;opacity:0;animation:scr 7s linear infinite}
.scratch.b{animation-duration:11s;animation-delay:3s;background:rgba(0,0,0,.4);width:2px}
@keyframes scr{0%{left:20%;opacity:0}3%{opacity:1}9%{left:23%;opacity:.6}11%{opacity:0}50%{left:71%;opacity:0}52%{opacity:.8}57%{left:69%;opacity:0}100%{left:69%;opacity:0}}

/* letterbox */
.lb{position:absolute;left:0;right:0;height:var(--bar);background:#000;z-index:5;transition:height 1.2s cubic-bezier(.6,0,.3,1)}
.lb.t{top:0}.lb.b{bottom:0}
body.open .lb{height:0}

/* hud inside the bars */
.hud{position:absolute;z-index:6;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.hud.t{top:0;height:var(--bar);padding-top:env(safe-area-inset-top,0px)}
.hud.b{bottom:0;height:var(--bar)}
.hud b{color:var(--stamp);font-weight:400}
#snd{background:none;border:0;padding:6px 0;cursor:pointer}
#snd[aria-pressed="true"]{color:var(--stamp)}
.rec{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-right:8px;vertical-align:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* subtitles */
#subs{position:absolute;z-index:7;left:0;right:0;bottom:calc(var(--bar) + 4vh);display:flex;justify-content:center;padding-inline:20px;pointer-events:none}
#subs span{max-width:min(900px,92vw);text-align:center;font:400 clamp(19px,2.3vw,30px)/1.3 var(--sans);color:#fff;
  text-shadow:0 0 2px #000,0 0 2px #000,0 2px 6px #000,0 0 20px rgba(0,0,0,.8);opacity:0;transition:opacity .25s ease}
#subs span.on{opacity:1}
#subs span.red{color:#ff5a3a;animation:glitch 2.4s steps(1) infinite}
#subs span.cross{text-decoration:line-through;text-decoration-thickness:3px;color:#cfc8bd}
@keyframes glitch{0%,80%,100%{transform:none}82%{transform:translateX(-4px) skewX(-10deg)}84%{transform:translateX(5px)}86%{transform:none}}
.tap{position:absolute;z-index:7;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--bar) + 10px);opacity:.5}

/* fork: the film freezes, two choices, a draining timer */
#fork{position:absolute;z-index:8;left:0;right:0;bottom:calc(var(--bar) + 3vh);display:none;flex-direction:column;align-items:center;gap:18px;padding-inline:16px}
#fork.on{display:flex;animation:fadein .5s both}
#fork .q{font:italic 300 clamp(22px,2.6vw,32px)/1.1 var(--serif);color:var(--bone);text-shadow:0 2px 10px #000}
#fork .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(760px,100%)}
#fork button{background:rgba(5,5,5,.72);border:1px solid rgba(236,230,218,.35);padding:18px 14px;cursor:pointer;
  font:700 clamp(14px,1.6vw,18px)/1.25 var(--sans);letter-spacing:.02em;text-transform:uppercase;transition:background .2s,border-color .2s,color .2s;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#fork button:hover,#fork button:focus-visible{border-color:var(--stamp);color:var(--stamp);outline:none}
#fork button.pick{background:var(--bone);color:#000;border-color:var(--bone)}
#fork button.nope{opacity:.25}
#fork .timer{width:min(760px,100%);height:3px;background:rgba(255,255,255,.15)}
#fork .timer i{display:block;height:100%;background:var(--bone);transform-origin:left;animation:drain var(--t,10s) linear both}
#fork.chosen .timer i{animation-play-state:paused}
@keyframes drain{to{transform:scaleX(0)}}
body.frozen #shot img.fg{animation-play-state:paused;filter:brightness(.55) contrast(1.2) saturate(.6) sepia(.2)}
body.frozen #shot{animation-play-state:paused}

/* title cards: opening and ending */
#card{position:absolute;inset:0;z-index:9;display:grid;place-items:center;text-align:center;padding:24px;background:#000;opacity:0;pointer-events:none;transition:opacity .6s ease}
#card.on{opacity:1;pointer-events:auto}
#card h1{margin:0;font:300 italic clamp(96px,22vw,320px)/.8 var(--serif);letter-spacing:-.06em}
#card h1 .k{color:transparent;-webkit-text-stroke:1px var(--bone)}
#card h1 .a{display:inline-block;transform:translateY(.12em) rotate(4deg);color:var(--ember);text-shadow:0 0 30px var(--ember)}
#card h2{margin:10px 0 0;font:300 italic clamp(54px,10vw,140px)/.9 var(--serif);letter-spacing:-.03em}
#card p{margin:22px auto 0;max-width:38ch;font:italic 300 clamp(19px,2.2vw,24px)/1.35 var(--serif);color:var(--ash)}
#card .tag{color:var(--stamp)}
.play{margin-top:34px;background:none;border:1px solid var(--bone);padding:16px 26px;cursor:pointer;font:15px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.play:hover,.play:focus-visible{border-color:var(--stamp);color:var(--stamp);outline:none}
.play.ghost{border-color:transparent;color:var(--ash);margin-top:12px}
.acts{display:flex;flex-direction:column;align-items:center}

/* ending credits roll */
.credits{height:42vh;overflow:hidden;margin-top:22px;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.credits div{animation:roll 26s linear both;padding-top:42vh}
.credits dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font:15px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.credits dt{text-align:right;color:var(--ash)}.credits dd{margin:0;text-align:left}
.credits .h{grid-column:1/-1;text-align:center;color:var(--stamp);margin-top:18px}
@keyframes roll{to{transform:translateY(-100%)}}
.wit{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.wit .n{font:italic 300 clamp(20px,2.6vw,28px)/1.1 var(--serif)}
.wit .n b{font-weight:500;color:var(--ember)}
.wit button{font:12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:transparent;border:1px solid var(--ember);padding:12px 16px;cursor:pointer}
.wit button b{color:var(--ember);font-weight:400}
.wit button[disabled]{opacity:.6}

#black{position:absolute;inset:0;z-index:8;background:#000;opacity:0;pointer-events:none;transition:opacity .35s ease}
#black.on{opacity:1}
#burn{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 70% 40%,rgba(255,240,200,.95),rgba(255,120,20,.7) 30%,rgba(120,20,0,.4) 60%,transparent 80%);mix-blend-mode:screen}
#burn.go{animation:burn .6s ease-out}
@keyframes burn{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#grain{position:fixed;inset:-10%;width:120%;height:120%;z-index:20;pointer-events:none;opacity:.1;mix-blend-mode:screen}
#scare{position:fixed;inset:0;z-index:30;pointer-events:none;background:#000 url("img/p10.jpg") center 30%/cover no-repeat;filter:grayscale(1) contrast(1.8) brightness(1.25)}
@keyframes fadein{from{opacity:0}to{opacity:1}}

@media (max-width:720px){
  :root{--bar:clamp(24px,7vh,60px)}
  #fork .opts{grid-template-columns:1fr}
  #shot img{--x0:30%;--x1:70%}
  .credits dl{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<div id="screen" aria-live="polite">
  <div id="shot"></div>
  <div class="vig" aria-hidden="true"></div>
  <div class="scratch" aria-hidden="true"></div><div class="scratch b" aria-hidden="true"></div>
  <div class="lb t"></div><div class="lb b"></div>
  <div class="hud t mono"><span id="scn"><span class="rec"></span>плёнка №3</span><button id="snd" class="mono" type="button" aria-pressed="false">звук: выкл</button></div>
  <div class="hud b mono"><span>концовок <b id="cntE">0</b>/5</span><span id="tc">00:00:00:00</span></div>
  <div id="subs"><span></span></div>
  <span class="tap mono" id="tap" hidden>тап — дальше</span>
  <div id="fork"><div class="q">Что делать?</div><div class="opts"></div><div class="timer"><i></i></div></div>
  <div id="black"></div>
  <div id="burn"></div>
  <div id="card"></div>
</div>
<canvas id="grain" width="320" height="320" aria-hidden="true"></canvas>
<div id="scare" aria-hidden="true" hidden></div>

<script>
/* ---------- story ---------- */
// img: frame, t: subtitles ("~" crossed out, "!" red, "@time" the viewer's clock), q: question at the fork, go: [label, scene], end: ending title
var S={
  n1:{t:[
    "Если вы это смотрите, значит, я так и не вернулся с заправки.",
    "@time",
    "Плёнку нашли у трассы. Тут всё по порядку.",
    "!И не смотрите на коня."],
    q:"С чего начать?",go:[["смотреть по порядку","road"],["перемотать на коня","horse"]]},

  horse:{img:"p10",scare:1,t:[
    "Вы перемотали на коня.",
    "!Я же просил.",
    "Раз вы его видели, он вас тоже видел.",
    "Ладно. Дальше смотрите с заправки."],
    q:"",go:[["смотреть дальше","station"]]},

  road:{img:"p0",t:[
    "Навигатор третий раз сказал: «Через двести метров поверните».",
    "Поворота не было. Был указатель.",
    "На указателе кто-то сидел и смотрел, как я еду."],
    q:"Что делать?",go:[["включить вспышку","sign"],["не останавливаться","station"]]},

  sign:{img:"p7",t:[
    "Со вспышкой я увидел, что лиц у него много.",
    "Одно из них было моё. Оно мне подмигнуло.",
    "Он молча показал в поле."],
    q:"Куда?",go:[["пойти, куда показали","field"],["газануть до заправки","station"]]},

  station:{img:"p10",t:[
    "Я приехал заправиться. Но была одна проблема.",
    "Колонку держал конь с чёлкой.",
    "«Бензина нет, — сказал он. — Есть люстра».",
    "~Я взял люстру.",
    "Я ничего не взял."],
    q:"Что дальше?",go:[["спросить, где переночевать","kitchen"],["уйти пешком через поле","barrel"]]},

  field:{img:"p1",t:[
    "В поле паслась лошадь. Голова у неё была не лошадиная.",
    "Она сказала «рррр».",
    "Я сделал вид, что не слышал, и начал медленно пятиться."],
    q:"Бежать куда?",go:[["к огонькам","barrel"],["в лес","forest"]]},

  barrel:{img:"p11",t:[
    "Посреди поля стояла бочка, а над ней душ.",
    "Горячую воду отключили в 2003-м. А тут была.",
    "Я залез. Вдалеке что-то загорелось, но вода была такая тёплая."],
    q:"Что делать?",go:[["вылезти и пойти на огонь","fire"],["сидеть, пока не остынет","taxa"]]},

  taxa:{img:"p12",t:[
    "Мимо проходила такса. Проходила минут сорок.",
    "На ней сидели парни. У всех было моё лицо.",
    "В самом конце было одно свободное место."],
    q:"Садиться?",go:[["сесть","E_taxa"],["не садиться","fire"]]},

  fire:{img:"p2",t:[
    "Горел дом. Перед ним лежал белый конь.",
    "Конь смотрел в другую сторону.",
    "На боку у коня было лицо. Догадайтесь чьё."],
    q:"Что делать?",go:[["посмотреть, куда смотрит конь","family"],["убежать в лес","forest"]]},

  family:{img:"p5",t:[
    "Там стояла моя семья. Нас было шестеро.",
    "У всех было моё лицо.",
    "!«Ты опоздал на ужин», — сказали они хором."],
    q:"Что ответить?",go:[["остаться с ними","E_family"],["сказать, что ты не он","kitchen"]]},

  kitchen:{img:"p13",t:[
    "Меня отвели в дом и посадили за стол.",
    "Повар в фартуке сказал, что ужин будет через пять минут.",
    "Он не сказал, кто ужин."],
    q:"Что делать?",go:[["взять вилку и ждать","E_dinner"],["вылезти в окно","forest"]]},

  forest:{img:"p6",t:[
    "В лесу я обнял ёлку, чтобы отдышаться.",
    "Из травы рос палец.",
    "Он рос там всегда. Мы просто не смотрели вниз."],
    q:"Что делать?",go:[["идти, куда указывает палец","gnomes"],["лечь и уснуть","bear"]]},

  gnomes:{img:"p4",t:[
    "Палец указывал на гномов. Гномы спасали лес.",
    "Лес не просил. Горело только там, где были гномы.",
    "Мне дали ведро."],
    q:"Что делать?",go:[["помогать гномам","bear"],["бросить ведро и бежать","bear"]]},

  bear:{img:"p14",t:[
    "Проснулся я в переноске. Переноску нёс медведь.",
    "Я давно вырос. Он считает, что я ещё маленький.",
    "Мы идём к морю. Я слышу волны."],
    q:"Что делать?",go:[["не сопротивляться","E_sea"],["вырваться и стучать в первую дверь","E_unicorn"]]},

  // endings
  E_taxa:{end:"Очередь",img:"p12",t:"Вы сели последним. Утром у трассы нашли ещё одну плёнку."},
  E_family:{end:"Семья",img:"p5",t:"Теперь нас семеро. Ужин всё ещё горячий."},
  E_dinner:{end:"Ужин",img:"p13",t:"Через пять минут на кухне стало тихо. Повар вытер руки о фартук."},
  E_unicorn:{end:"Новый год",img:"p3",t:"Дверь открыл единорог. «С Новым годом», — сказал он. На дворе октябрь. Я остался."},
  E_sea:{end:"Море",img:"p9",t:"Море было спокойным. Под водой было лицо. Я положил плёнку в коробку и отпустил её по воде. Если вы это смотрите…"},
  E_secret:{end:"Вырезанная сцена",img:"p8",secret:1,t:"Этот кадр снят изнутри. Вы посмотрели все концовки. Теперь он знает, где вы живёте."}
};
var ENDS=["E_taxa","E_family","E_dinner","E_unicorn","E_sea"];
var ORDER=["n1","horse","road","sign","station","field","barrel","taxa","fire","family","kitchen","forest","gnomes","bear"];

/* ---------- per-viewer progress ---------- */
function load(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return []}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var seenE=load("durka-ends");
function found(){return seenE.filter(function(e){return ENDS.indexOf(e)>=0}).length}
function counts(){document.getElementById("cntE").textContent=found()}

/* ---------- player ---------- */
var $=function(id){return document.getElementById(id)};
var shot=$("shot"),subs=$("subs").firstChild,fork=$("fork"),card=$("card"),black=$("black"),burnEl=$("burn"),tapHint=$("tap");
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var skip=null,run=0;
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function wait(ms,skippable){return new Promise(function(r){var t=setTimeout(done,ms);if(skippable)skip=done;function done(){clearTimeout(t);if(skip===done)skip=null;r()}})}
function shutter(loud){window.durkaShutter&&window.durkaShutter(loud)}

function frame(img){
  shot.innerHTML="";if(!img)return;
  var bg=new Image(),el=new Image();bg.src=el.src="img/"+img+".jpg";bg.alt=el.alt="";bg.className="bg";el.className="fg";
  var up=Math.random()<.5;
  el.style.setProperty("--y0",up?"85%":"15%");el.style.setProperty("--y1",up?"15%":"85%");el.style.setProperty("--o",up?"25%":"70%");
  shot.appendChild(bg);shot.appendChild(el);
  requestAnimationFrame(function(){requestAnimationFrame(function(){bg.classList.add("on");el.classList.add("on")})});
}
function timeLine(){
  var d=new Date(),h=d.getHours(),m=("0"+d.getMinutes()).slice(-2);
  return "Сейчас "+h+":"+m+". "+(h>=22||h<5?"Поздновато. Вы смотрите это один?":"Вы смотрите это один?");
}
async function say(line,my){
  var cls="";if(line[0]=="~"){cls="cross";line=line.slice(1)}else if(line[0]=="!"){cls="red";line=line.slice(1)}
  if(line=="@time")line=timeLine();
  subs.className="";subs.textContent=line;void subs.offsetWidth;subs.className="on "+cls;
  if(cls=="red"){burnEl.classList.remove("go");void burnEl.offsetWidth;burnEl.classList.add("go");shutter(true)}
  await wait(Math.max(2600,line.length*62)+(cls=="cross"?400:0),true);
  if(my!==run)return;
  subs.className="";await wait(250);
}
async function cut(){black.classList.add("on");await wait(380)}
function uncut(){black.classList.remove("on")}

async function play(id){
  var my=++run,s=S[id];
  fork.classList.remove("on","chosen");document.body.classList.remove("frozen");
  if(s.end)return ending(id,my);
  await cut();if(my!==run)return;
  card.classList.remove("on");document.body.classList.remove("open");
  frame(s.img);
  var n=ORDER.indexOf(id);
  $("scn").innerHTML='<span class="rec"></span>сцена '+("0"+(n+1)).slice(-2);
  uncut();
  if(s.scare)scare(1600);
  await wait(s.img?900:400);
  tapHint.hidden=false;
  for(var i=0;i<s.t.length;i++){if(my!==run)return;await say(s.t[i],my)}
  tapHint.hidden=true;
  if(my!==run)return;
  var next=await choose(s,my);
  if(my===run&&next)play(next);
}
function choose(s,my){
  return new Promise(function(res){
    document.body.classList.add("frozen");shutter(false);
    fork.querySelector(".q").textContent=s.q||"";
    var opts=fork.querySelector(".opts");
    opts.style.gridTemplateColumns=s.go.length<2?"minmax(0,1fr)":"";
    opts.innerHTML=s.go.map(function(g,i){return '<button type="button" data-i="'+i+'">'+esc(g[0])+'</button>'}).join("");
    var secs=s.go.length<2?6:10;fork.style.setProperty("--t",secs+"s");
    var bar=fork.querySelector(".timer i");bar.style.animation="none";void bar.offsetWidth;bar.style.animation="";
    fork.classList.add("on");
    var done=false,timer=setTimeout(function(){pick(0,true)},secs*1000);
    function pick(i,auto){
      if(done||my!==run)return;done=true;clearTimeout(timer);fork.classList.add("chosen");
      opts.querySelectorAll("button").forEach(function(b,j){b.classList.add(j===i?"pick":"nope")});

  });
}

async function ending(id,my){

setInterval(function(){if(document.body.classList.contains("frozen"))return;var ms=Date.now()-t0,f=Math.floor(ms/41.6)%24,sec=Math.floor(ms/1000);

/* ---------- screamer (only when you rewind to the horse) ---------- */
function scare(after){
  if(reduce)return;
  setTimeout(function(){var sc=$("scare");sc.hidden=false;shutter(true);setTimeout(function(){sc.hidden=true},140)},after);
}

/* ---------- viewer counter on endings ---------- */
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var offline={visit:666,seen:0};
function api(method,k){return fetch("/api/witness"+(k?"?k="+k:""),{method:method,cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function witness(){
  var vN=$("visitN"),sN=$("seenN"),sb=$("seen");
  function fill(d){vN.textContent=d.visit;sN.textContent=d.seen}
  var firstVisit=!get("durka-visit");
  api(firstVisit?"POST":"GET",firstVisit?"visit":"").then(function(d){put("durka-visit","1");fill(d)}).catch(function(){fill(offline)});
  if(get("durka-seen"))sb.disabled=true;
  sb.addEventListener("click",function(e){
    e.stopPropagation();if(sb.disabled)return;sb.disabled=true;put("durka-seen","1");shutter(false);
    api("POST","seen").then(fill).catch(function(){offline.seen++;fill(offline)});
  });
}

<script>
(function(){
  // film grain
  var c=document.getElementById("grain"),x=c.getContext("2d"),img=x.createImageData(320,320),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,last=0;
  function grain(ts){
    if(ts-last>60){last=ts;var d=img.data;for(var i=0;i<d.length;i+=4){var v=Math.random()*255|0;d[i]=v;d[i+1]=v*.92|0;d[i+2]=v*.8|0;d[i+3]=255}x.putImageData(img,0,0)}
    if(!reduce)requestAnimationFrame(grain);
  }
  requestAnimationFrame(grain);

  // sound: projector clatter and a low hum, shutter clicks at the forks
  var ac=null,on=false,btn=document.getElementById("snd");
  function noise(sec){var b=ac.createBuffer(1,ac.sampleRate*sec|0,ac.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
  function burst(t,dur,freq,vol){var s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise(dur);f.type="highpass";f.frequency.value=freq;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(ac.destination);s.start(t)}
  window.durkaShutter=function(loud){if(!on)return;var t=ac.currentTime;burst(t,.05,1800,loud?.9:.5);burst(t+.07,.09,900,loud?.7:.35);if(loud)burst(t+.02,.5,200,.6)};
  function startAmb(){
    var g=ac.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.05,ac.currentTime+3);g.connect(ac.destination);
    [41,55.3,82.4].forEach(function(f,i){var o=ac.createOscillator();o.frequency.value=f;var og=ac.createGain();og.gain.value=[1,.7,.25][i];o.connect(og).connect(g);o.start()});
    setInterval(function(){if(on&&!document.body.classList.contains("frozen")&&!document.body.classList.contains("open"))burst(ac.currentTime,.012,2600,.025+Math.random()*.02)},42);
  }
  function setSound(v){
    try{
      if(v&&!ac){ac=new (window.AudioContext||window.webkitAudioContext)();startAmb()}
      if(ac){v?ac.resume():ac.suspend()}
      on=v;btn.setAttribute("aria-pressed",v?"true":"false");btn.textContent=v?"звук: вкл":"звук: выкл";
    }catch(e){}
  }
  window.durkaSound=function(v){if(!on&&v&&!btn.dataset.off)setSound(true)};
  btn.addEventListener("click",function(e){e.stopPropagation();if(on)btn.dataset.off="1";else delete btn.dataset.off;setSound(!on)});
})();
</script>
