<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дурка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,500&family=PT+Mono&family=Caveat:wght@400;600&display=swap">
<style>
/* Layout: a box of evidence found by the road. One scene at a time: a polaroid develops on the left, a handwritten note on the right, choices underneath */
:root{
  --night:#050505; --ash:#8f8a82; --bone:#ece6da; --stamp:#ff7a1a; --ember:#ff4d00;
  --paper:#d8cfbd; --ink:#1d1a16; --inkfade:#5a5148;
  --serif:"Cormorant Garamond","Times New Roman",serif; --mono:"PT Mono","Courier New",monospace; --hand:"Caveat","Comic Sans MS",cursive;
  color-scheme:dark;
}
html,body{margin:0}
html{background:var(--night)}
body{background:var(--night);color:var(--bone);font-family:var(--serif);overflow-x:hidden;min-height:100vh}
img{display:block;max-width:100%}
::selection{background:var(--stamp);color:#000}
button{font:inherit;color:inherit}

/* overlays */
#dark{position:fixed;inset:0;z-index:40;pointer-events:none;
  background:radial-gradient(circle at var(--x,50%) var(--y,45%),rgba(0,0,0,0) 0,rgba(0,0,0,.05) 180px,rgba(0,0,0,.45) 460px,rgba(0,0,0,.65) 100%);
  transition:opacity .9s ease}
body.flashed #dark{opacity:0;transition:none}
#flash{position:fixed;inset:0;z-index:50;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:flash .7s ease-out}
#grain{position:fixed;inset:-10%;width:120%;height:120%;z-index:45;pointer-events:none;opacity:.09;mix-blend-mode:screen}
.scan{position:fixed;inset:0;z-index:44;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
@keyframes flash{0%{opacity:1}12%{opacity:.95}100%{opacity:0}}
#scare{position:fixed;inset:0;z-index:70;pointer-events:none;background:#000 url("img/p10.jpg") center 30%/cover no-repeat;filter:grayscale(1) contrast(1.8) brightness(1.25)}

.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font:12px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ash)}
.st{font:13px/1 var(--mono);color:var(--stamp);text-shadow:0 0 6px rgba(255,110,20,.9);letter-spacing:.08em}

/* top bar */
.bar{position:fixed;inset:0 0 auto;z-index:60;display:flex;justify-content:space-between;gap:16px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px;
  background:linear-gradient(#050505 40%,rgba(5,5,5,0))}
.bar b{color:var(--stamp);font-weight:400}
#snd{background:none;border:0;padding:0;cursor:pointer}
#snd[aria-pressed="true"]{color:var(--stamp)}

/* intro */
.intro{min-height:100vh;display:grid;align-content:center;gap:28px;padding-block:80px 60px;position:relative;overflow:hidden;isolation:isolate}
.intro h1{margin:0;font:300 italic clamp(110px,28vw,400px)/.78 var(--serif);letter-spacing:-.06em;margin-left:-.04em;text-shadow:0 0 40px rgba(255,90,20,.18)}
.intro h1 span{display:inline-block}
.intro h1 .k{color:transparent;-webkit-text-stroke:1px var(--bone)}
.intro h1 .a{transform:translateY(.12em) rotate(4deg);color:var(--ember);text-shadow:0 0 30px var(--ember)}
.intro h1{margin-bottom:.12em}
.intro .ghost{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;width:min(30vw,380px);transform:translateY(-50%);z-index:-1;animation:flick 4.2s steps(1) infinite}
.intro .ghost .pol{--r:6deg}
@keyframes flick{0%{filter:brightness(.35)}6%{filter:brightness(1.6)}8%{filter:brightness(.15)}10%{filter:brightness(1.2)}14%{filter:brightness(.4)}48%{filter:brightness(.3)}50%{filter:brightness(1.8)}51%{filter:brightness(0)}53%{filter:brightness(1.3)}56%{filter:brightness(.7)}82%{filter:brightness(.3)}84%{filter:brightness(1.4)}86%{filter:brightness(.2)}100%{filter:brightness(.35)}}
.intro p{margin:0;max-width:36ch;font:italic 300 clamp(20px,2.4vw,26px)/1.3 var(--serif);color:var(--ash)}
.intro .acts{display:flex;flex-direction:column;align-items:flex-start;gap:14px}

/* scene */
.scene{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,5vw,80px);align-items:center;
  padding-block:calc(70px + env(safe-area-inset-top,0px)) 60px;max-width:1240px;margin-inline:auto;box-sizing:border-box}
.scene.noimg{grid-template-columns:minmax(0,1fr);max-width:760px}

.scene .pol{width:min(440px,100%);justify-self:center}
.pol{margin:0;background:#efebe2;padding:12px 12px 52px;box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.4);transform:rotate(var(--r,-2deg));position:relative;
  animation:drop .9s cubic-bezier(.2,.8,.2,1) both}
.pol .ph{position:relative;overflow:hidden;background:#111}
.pol img{width:100%;height:auto;max-height:66vh;object-fit:cover;animation:develop 4.5s ease-out both}
.pol .ph::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 70px 10px rgba(0,0,0,.6);pointer-events:none}
.pol time{position:absolute;right:10px;bottom:10px;z-index:2;animation:fadein 1s 3.6s both}
.pol figcaption{position:absolute;left:16px;right:16px;bottom:12px;font:600 22px/1 var(--hand);color:#2d2722;animation:fadein 1s 3s both}
@keyframes develop{0%{filter:brightness(2.6) contrast(.25) sepia(.8) blur(6px);opacity:.2}35%{filter:brightness(1.6) contrast(.6) sepia(.6) blur(3px);opacity:.7}
  100%{filter:brightness(.95) contrast(1.08) sepia(.08) blur(0);opacity:1}}
@keyframes drop{from{transform:translateY(-30px) rotate(calc(var(--r,-2deg) * 4));opacity:0}to{transform:rotate(var(--r,-2deg));opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.note{position:relative;background:var(--paper);color:var(--ink);padding:clamp(22px,3vw,36px) clamp(22px,3vw,40px) clamp(26px,3vw,40px);transform:rotate(var(--r2,1deg));
  box-shadow:0 18px 50px rgba(0,0,0,.75);
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(60,80,120,.18) 33px 34px),linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.08));
  clip-path:polygon(0 1%,4% 0,18% 1.2%,33% 0,51% .9%,68% 0,85% 1.1%,100% 0,99.4% 50%,100% 100%,80% 99%,62% 100%,40% 99.2%,22% 100%,0 99%,.6% 50%);
  animation:fadein .6s both}
.note .num{font:12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--inkfade);margin-bottom:14px}
.note p{margin:0 0 .35em;font:400 clamp(25px,2.6vw,31px)/34px var(--hand);opacity:0;animation:fadein .9s both}
.note p.cross{text-decoration:line-through;text-decoration-thickness:2px;color:var(--inkfade)}
.note p.red{color:#8a1a0a}

.choices{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:26px;opacity:0;animation:fadein .8s both}
.ch{background:none;border:0;border-bottom:1px solid rgba(255,122,26,.45);padding:8px 0;cursor:pointer;text-align:left;
  font:14px/1.4 var(--mono);letter-spacing:.06em;color:var(--bone)}
.ch::before{content:"→ ";color:var(--stamp)}
.ch:hover{color:var(--stamp)}
.ch:focus-visible,#snd:focus-visible,.wit button:focus-visible{outline:2px solid var(--stamp);outline-offset:4px}
.ch.big{font-size:16px;padding:12px 0}

/* ending */
.end{min-height:100vh;display:grid;place-items:center;text-align:center;padding-block:90px 60px;box-sizing:border-box}
.end .tag{color:var(--stamp)}
.end h2{margin:14px 0 0;font:300 italic clamp(56px,11vw,150px)/.9 var(--serif);letter-spacing:-.03em}
.end p{margin:22px auto 0;max-width:38ch;font:italic 300 22px/1.3 var(--serif);color:var(--ash)}
.end .pol{width:min(300px,70vw);margin:36px auto 0;--r:3deg}
.end .choices{align-items:center;margin-top:36px}
.wit{margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.wit .n{font:italic 300 clamp(22px,3vw,34px)/1.1 var(--serif)}
.wit .n b{font-weight:500;color:var(--ember);font-variant-numeric:tabular-nums}
.wit button{font:13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:transparent;border:1px solid var(--ember);padding:14px 18px;cursor:pointer}
.wit button b{color:var(--ember);font-weight:400}
.wit button[disabled]{opacity:.6}

#stage{transition:opacity .45s ease}
#stage.out{opacity:0}

@media (max-width:760px){
  .intro .ghost{position:relative;right:auto;top:auto;transform:none;width:64vw;max-width:280px;margin:0 0 0 auto;order:-1;z-index:0}
  .intro{align-content:start}
  .scene{grid-template-columns:1fr;align-content:start;gap:30px;padding-top:calc(60px + env(safe-area-inset-top,0px))}
  .pol{width:min(340px,86%);justify-self:center}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="grain" width="420" height="420" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<div id="dark" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div id="scare" aria-hidden="true" hidden></div>

<div class="bar g mono">
  <span>Проявлено <b id="cntP">0</b>/15 · концовок <b id="cntE">0</b>/5</span>
  <button id="snd" class="mono" type="button" aria-pressed="false">звук: выкл</button>
</div>

<main id="stage" class="g" aria-live="polite"></main>

<script>
/* ---------- story ---------- */
// img: photo file, d: date stamp, c: caption on the polaroid, t: note lines ("~" crossed out, "!" red), go: [label, scene], end: ending title
var S={
  n1:{num:"записка 1",t:[
    "Если ты это нашёл, значит, я так и не вернулся с заправки.",
    "Тут всё по порядку. Записки, фото. Кассету не включай.",
    "И ещё. Не смотри на коня."],
    go:[["разложить записки по порядку","road"],["вытряхнуть фотографии на стол","horse"]]},

  horse:{img:"p10",d:"'03 11 02",c:"не смотри",scare:1,num:"оборот фотографии",t:[
    "Сверху лежал конь.",
    "!Я же просил.",
    "Ладно. Раз уж ты его видел, он тебя тоже видел. Читай с заправки."],
    go:[["читать дальше","station"]]},

  road:{img:"p0",d:"'03 10 27",c:"без вспышки",num:"записка 2",t:[
    "Навигатор третий раз сказал «через 200 метров поверните».",
    "Поворота не было. Был указатель.",
    "На указателе кто-то сидел и смотрел, как я еду."],
    go:[["включить вспышку","sign"],["не останавливаться","station"]]},

  sign:{img:"p7",d:"'03 10 27",c:"со вспышкой",num:"записка 3",t:[
    "Со вспышкой я увидел, что лиц у него много.",
    "Одно из них было моё. Оно мне подмигнуло.",
    "Он молча показал в поле."],
    go:[["пойти, куда показали","field"],["газануть до заправки","station"]]},

  station:{img:"p10",d:"'03 11 02",c:"АЗС",num:"записка 4",t:[
    "Я приехал заправиться. Но была одна проблема.",
    "Колонку держал конь с чёлкой. Бензина нет, сказал он. Есть люстра.",
    "~Я взял люстру.",
    "Я не стал ничего брать."],
    go:[["спросить, где переночевать","kitchen"],["уйти пешком через поле","barrel"]]},

  field:{img:"p1",d:"'03 10 28",c:"поле",num:"записка 5",t:[
    "В поле паслась лошадь. Голова у неё была не лошадиная.",
    "Она сказала «рррр».",
    "Я сделал вид, что не слышал, и стал медленно пятиться."],
    go:[["бежать к огонькам","barrel"],["бежать в лес","forest"]]},

  barrel:{img:"p11",d:"'03 9 14",c:"горячая!!",num:"записка 6",t:[
    "Посреди поля стояла бочка, а над ней душ.",
    "Горячую воду отключили в 2003-м. А тут была.",
    "Я залез. Вдалеке что-то загорелось, но вода была такая тёплая."],
    go:[["вылезти и пойти на огонь","fire"],["сидеть, пока не остынет","taxa"]]},

  taxa:{img:"p12",d:"'03 6 22",c:"очередь",num:"записка 7",t:[
    "Мимо проходила такса. Проходила минут сорок.",
    "На ней сидели парни. У всех было моё лицо.",
    "В самом конце было одно свободное место."],
    go:[["сесть","E_taxa"],["не садиться","fire"]]},

  fire:{img:"p2",d:"'03 10 27",c:"дом",num:"записка 8",t:[
    "Горел дом. Перед ним лежал белый конь.",
    "Конь смотрел в другую сторону.",
    "На боку у коня было лицо. Догадайся чьё."],
    go:[["посмотреть, куда смотрит конь","family"],["убежать в лес","forest"]]},

  family:{img:"p5",d:"'03 10 27",c:"мы",num:"записка 9",t:[
    "Там стояла моя семья. Нас было шестеро.",
    "У всех было моё лицо.",
    "«Ты опоздал на ужин», сказали они хором."],
    go:[["остаться с ними","E_family"],["сказать, что ты не он","kitchen"]]},

  kitchen:{img:"p13",d:"'03 2 14",c:"ужин",num:"записка 10",t:[
    "Меня отвели в дом и посадили за стол.",
    "Повар в фартуке сказал, что ужин будет через пять минут.",
    "Он не сказал, кто ужин."],
    go:[["взять вилку и ждать","E_dinner"],["вылезти в окно","forest"]]},

  forest:{img:"p6",d:"'03 8 05",c:"не смотри вниз",num:"записка 11",t:[
    "В лесу я обнял ёлку, чтобы отдышаться.",
    "Из травы рос палец.",
    "Он рос там всегда. Мы просто не смотрели вниз."],
    go:[["пойти туда, куда указывает палец","gnomes"],["лечь и уснуть","bear"]]},

  gnomes:{img:"p4",d:"'03 12 31",c:"спасатели",num:"записка 12",t:[
    "Палец указывал на гномов. Гномы спасали лес.",
    "Лес не просил. Лес горел только там, где гномы.",
    "Мне дали ведро."],
    go:[["помогать гномам","bear"],["бросить ведро и бежать","bear"]]},

  bear:{img:"p14",d:"'03 8 23",c:"меня несут",num:"записка 13",t:[
    "Проснулся я в переноске. Переноску нёс медведь.",
    "Я давно вырос. Он считает, что я ещё маленький.",
    "Мы идём к морю. Я слышу волны."],
    go:[["не сопротивляться","E_sea"],["вырваться и стучать в первую дверь","E_unicorn"]]},

  // endings
  E_taxa:{end:"Очередь",img:"p12",t:"Ты сел последним. Утром кто-то нашёл ещё одну коробку."},
  E_family:{end:"Семья",img:"p5",t:"Теперь нас семеро. Ужин всё ещё горячий."},
  E_dinner:{end:"Ужин",img:"p13",t:"Через пять минут на кухне стало тихо. Повар вытер руки о фартук."},
  E_unicorn:{end:"Новый год",img:"p3",t:"Дверь открыл единорог. Сказал: «С Новым годом». На дворе октябрь. Я остался."},
  E_sea:{end:"Море",img:"p9",t:"Море было спокойным. Под водой было лицо. Я сложил записки в коробку и отпустил её по воде. Если ты это нашёл…"},
  E_secret:{end:"Изнутри",img:"p8",secret:1,t:"Последний кадр снят изнутри. Ты собрал всех. Теперь он знает, где ты живёшь."}
};
var ENDS=["E_taxa","E_family","E_dinner","E_unicorn","E_sea"];

/* ---------- state (per-viewer, survives reloads when storage works) ---------- */
function load(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return []}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var seenP=load("durka-photos"),seenE=load("durka-ends");
function mark(list,key,v){if(v&&list.indexOf(v)<0){list.push(v);save(key,list)}}
function counts(){document.getElementById("cntP").textContent=Math.min(seenP.length,15);document.getElementById("cntE").textContent=seenE.filter(function(e){return ENDS.indexOf(e)>=0}).length}

/* ---------- rendering ---------- */
var stage=document.getElementById("stage");
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pol(img,d,c,r){
  return '<figure class="pol" style="--r:'+r+'deg"><div class="ph"><img src="img/'+img+'.jpg" alt=""><time class="st">'+(d||"'03 ?? ??")+'</time></div>'+(c?'<figcaption>'+esc(c)+'</figcaption>':'')+'</figure>';
}
function btns(list,delay,cls){
  return '<div class="choices" style="animation-delay:'+delay+'s">'+list.map(function(g){return '<button class="ch '+(cls||'')+'" type="button" data-go="'+g[1]+'">'+esc(g[0])+'</button>'}).join("")+'</div>';
}
function intro(){
  var all=seenE.filter(function(e){return ENDS.indexOf(e)>=0}).length===ENDS.length;
  var go=[["открыть коробку","n1"]];
  if(all)go.push(["на дне коробки что-то шевелится","E_secret"]);
  return '<section class="intro"><h1 aria-label="дурка"><span>д</span><span class="k">у</span><span>р</span><span>к</span><span class="a">а</span></h1>'+
    '<div class="ghost" aria-hidden="true">'+pol("p5","'03 ?? ??","не открывай",6)+'</div><p>Коробку нашли у трассы 27 октября. Внутри были записки, полароиды и кассета без подписи. На всех фотографиях одно лицо.</p>'+
    '<div class="acts">'+btns(go,.3,"big")+'<span class="mono">'+(seenE.length?"ты уже открывал её. она это помнит":"нажимай куда угодно, будет вспышка")+'</span></div></section>';
}
function scene(id){
  var s=S[id],r=(Math.random()*5-3).toFixed(1),r2=(Math.random()*2.4-1.2).toFixed(1),h="";
  if(s.end){
    var n=ENDS.indexOf(id);
    return '<section class="end"><div><div class="mono tag">'+(s.secret?"тайная концовка":"концовка "+(n+1)+" из 5")+'</div><h2>'+esc(s.end)+'</h2>'+pol(s.img,"'03 ?? ??","",3)+
      '<p>'+esc(s.t)+'</p>'+btns([["сложить всё обратно в коробку","intro"]],1.2,"big")+
      '<div class="wit"><div class="n">Вы — <b id="visitN">…</b>-й свидетель</div><button id="seen" type="button">Я видел этого человека · <b id="seenN">…</b></button></div></div></section>';
  }
  var lines=s.t.map(function(l,i){var cls=l[0]=="~"?"cross":l[0]=="!"?"red":"";if(cls)l=l.slice(1);
    return '<p class="'+cls+'" style="animation-delay:'+(1+i*1.1).toFixed(1)+'s">'+esc(l)+'</p>'}).join("");
  h+='<section class="scene'+(s.img?'':' noimg')+'">'+(s.img?pol(s.img,s.d,s.c,r):'')+
     '<div><div class="note" style="--r2:'+r2+'deg"><div class="num">'+esc(s.num)+'</div>'+lines+'</div>'+btns(s.go,1+s.t.length*1.1+.3)+'</div></section>';
  return h;
}
function show(id,first){
  function paint(){
    stage.innerHTML=id==="intro"?intro():scene(id);
    var s=S[id];
    if(s){mark(seenP,"durka-photos",s.img);if(s.end)mark(seenE,"durka-ends",id)}
    counts();
    if(s&&s.end)witness();
    if(s&&s.scare)scare();
    window.scrollTo(0,0);
    stage.classList.remove("out");
    var b=stage.querySelector(".ch");if(b&&!first)b.focus({preventScroll:true});
  }
  if(first){paint();return}
  stage.classList.add("out");setTimeout(paint,450);
}
stage.addEventListener("click",function(e){
  var b=e.target.closest(".ch");if(!b)return;
  show(b.getAttribute("data-go"));
});
show("intro",true);

/* ---------- screamer (only when you look at the horse) ---------- */
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function scare(){
  if(reduce)return;
  setTimeout(function(){var sc=document.getElementById("scare");sc.hidden=false;window.durkaShutter&&window.durkaShutter(true);setTimeout(function(){sc.hidden=true},140)},1700);
}

/* ---------- witnesses counter on endings ---------- */
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var offline={visit:666,seen:0};
function api(method,k){return fetch("/api/witness"+(k?"?k="+k:""),{method:method,cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function witness(){
  var vN=document.getElementById("visitN"),sN=document.getElementById("seenN"),sb=document.getElementById("seen");
  function fill(d){vN.textContent=d.visit;sN.textContent=d.seen}
  var firstVisit=!get("durka-visit");
  api(firstVisit?"POST":"GET",firstVisit?"visit":"").then(function(d){put("durka-visit","1");fill(d)}).catch(function(){fill(offline)});
  if(get("durka-seen"))sb.disabled=true;
  sb.addEventListener("click",function(e){
    e.stopPropagation();if(sb.disabled)return;sb.disabled=true;put("durka-seen","1");window.durkaShutter&&window.durkaShutter(false);
    api("POST","seen").then(fill).catch(function(){offline.seen++;fill(offline)});
  });
}
</script>
<script>
(function(){
  var dark=document.getElementById("dark");
  function move(x,y){dark.style.setProperty("--x",x+"px");dark.style.setProperty("--y",y+"px")}
  addEventListener("pointermove",function(e){move(e.clientX,e.clientY)},{passive:true});

  var fl=document.getElementById("flash"),t;
  addEventListener("click",function(e){
    move(e.clientX,e.clientY);
    fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");
    document.body.classList.add("flashed");clearTimeout(t);
    t=setTimeout(function(){document.body.classList.remove("flashed")},1600);
  });

  // film grain
  var c=document.getElementById("grain"),x=c.getContext("2d"),img=x.createImageData(420,420),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,last=0;
  function grain(ts){
    if(ts-last>70){last=ts;var d=img.data;for(var i=0;i<d.length;i+=4){var v=Math.random()*255|0;d[i]=v;d[i+1]=v*.92|0;d[i+2]=v*.8|0;d[i+3]=255}x.putImageData(img,0,0)}
    if(!reduce)requestAnimationFrame(grain);
  }
  requestAnimationFrame(grain);

  // sound: shutter on every flash, low hum and fire crackle underneath
  var ac=null,on=false,btn=document.getElementById("snd");
  function noise(sec){var b=ac.createBuffer(1,ac.sampleRate*sec|0,ac.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
  function burst(t,dur,freq,vol){var s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise(dur);f.type="highpass";f.frequency.value=freq;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(ac.destination);s.start(t)}
  window.durkaShutter=function(loud){if(!on)return;var t=ac.currentTime;burst(t,.05,1800,loud?.9:.5);burst(t+.07,.09,900,loud?.7:.35);if(loud)burst(t+.02,.5,200,.6)};
  function startAmb(){
    var g=ac.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.05,ac.currentTime+3);g.connect(ac.destination);
    [41,55.3,82.4].forEach(function(f,i){var o=ac.createOscillator();o.frequency.value=f;var og=ac.createGain();og.gain.value=[1,.7,.25][i];o.connect(og).connect(g);o.start()});
    setInterval(function(){if(on&&Math.random()<.55){burst(ac.currentTime,.015+Math.random()*.03,1200+Math.random()*2500,.04+Math.random()*.08)}},90);
  }
  function setSound(v){
    try{
      if(v&&!ac){ac=new (window.AudioContext||window.webkitAudioContext)();startAmb()}
      if(ac){v?ac.resume():ac.suspend()}
      on=v;btn.setAttribute("aria-pressed",v?"true":"false");btn.textContent=v?"звук: вкл":"звук: выкл";
    }catch(e){}
  }
  var first=true;
  addEventListener("click",function(e){
    if(e.target===btn){setSound(!on);first=false;return}
    if(first){first=false;setSound(true)}
    window.durkaShutter(false);
  });

  // browser tab calls you back
  var title=document.title,tt;
  document.addEventListener("visibilitychange",function(){
    clearInterval(tt);
    if(document.hidden){var w=["вернись","он здесь","не закрывай","мы ждём"],i=0;document.title=w[0];tt=setInterval(function(){i=(i+1)%w.length;document.title=w[i]},1500)}
    else document.title=title;
  });
})();
</script>
</body>
</html>
